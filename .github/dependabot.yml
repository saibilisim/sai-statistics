# Keeps the SHA-pinned GitHub Actions in .github/workflows current: Dependabot
# opens a PR when a pinned action has a newer release, so pins don't go stale.
# All action updates are grouped into one weekly PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
