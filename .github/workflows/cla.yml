# cla.yml — Contributor License Agreement check (CLA Assistant Lite).
#
# Asks every new contributor to sign CLA.md by commenting on their pull
# request, and records the signature in the `cla-signatures` branch of this
# repository (created on the first signature). The check runs as
# pull_request_target so it can comment on PRs from forks; it never checks out
# or runs the pull request's code.
#
# If a ruleset protects all branches, exempt `cla-signatures` or the action
# cannot record signatures.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # to record signatures in the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # contributor-assistant/github-action v2.6.1, pinned by commit
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/saibilisim/sai-statistics/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: saibilisim,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
