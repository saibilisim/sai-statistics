name: CI

# Every push to main runs the quick checks (hygiene + typecheck/lint/unit/build).
# The slow suites (R validation ~12 min, E2E ~70 min) run on a version tag
# (v*, the same trigger as package.yml), on pull requests and on demand.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A full run takes a while; a newer push to the same branch/PR supersedes it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # The pre-commit hook's checks, again on the server: a commit made with
  # --no-verify, or from a clone where the hook was never enabled, is caught
  # here. Cheap, so it runs on every push and pull request.
  hygiene:
    name: Data files and secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: No data files outside the allow-list
        run: git ls-files | sh .githooks/check-files

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: No secrets in the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  r-validation:
    name: R script validation
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        id: setup-r
        with:
          use-public-rspm: true

      # Prebuilt Linux binaries from the same dated Posit Package Manager
      # snapshot the shipped runtimes use (shared/r-packages.json
      # runtime.cranSnapshot). Without this, setup.R installed from
      # cloud.r-project.org, which serves Linux only as source: ~50 minutes
      # of compiling per run.
      - name: Select binary R package repository
        run: |
          snapshot=$(node -p "require('./shared/r-packages.json').runtime.cranSnapshot")
          echo "SAI_R_REPO=${snapshot/\/cran\//\/cran\/__linux__\/$(lsb_release -cs)\/}" >> "$GITHUB_ENV"

      - name: Cache R packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('app/shared/r-packages.json') }}

      - name: Install required R packages
        run: Rscript r-scripts/setup.R

      - name: Run r-validation suite
        run: Rscript tests/r-validation/run-all.R

  e2e:
    name: E2E (Playwright-driven Electron)
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Non-blocking until the suite is green on CI: as of 2026-10-21 a set of
    # scripts still fails there (see the run log) and is being worked through.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        id: setup-r
        with:
          use-public-rspm: true

      - name: Select binary R package repository
        run: |
          snapshot=$(node -p "require('./shared/r-packages.json').runtime.cranSnapshot")
          echo "SAI_R_REPO=${snapshot/\/cran\//\/cran\/__linux__\/$(lsb_release -cs)\/}" >> "$GITHUB_ENV"

      - name: Cache R packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('app/shared/r-packages.json') }}

      - name: Install required R packages
        run: Rscript r-scripts/setup.R

      - name: Build
        run: pnpm build

      - name: Install Playwright + Electron system dependencies
        run: npx playwright install-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Generate e2e fixtures
        run: node tests/e2e/setup-e2e-fixtures.cjs

      - name: Run e2e suite
        run: xvfb-run -a pnpm test:e2e
