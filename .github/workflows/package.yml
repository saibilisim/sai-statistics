# Builds the real installers — Windows .exe, macOS .dmg per CPU, Linux
# .deb/.rpm/AppImage — and verifies each: the thing a user actually downloads,
# which ci.yml never touches. All unsigned; official builds are signed by the
# release process outside this repository.
#
# ci.yml runs on ubuntu against a SYSTEM R it installs fresh. That is the
# "developer installs their own R" path, not the shipped one, and the gap is
# how a vendored runtime missing R's recommended package set shipped with
# Survival, Bootstrap, Discriminant, KNN and Trees quietly broken while every
# check was green.
#
# Deliberately NOT on every push: each job builds a ~400MB R runtime (the
# Linux one compiles its packages from source) and packages the app. Releases and on-demand
# only, so day-to-day development is unaffected but no release ever goes out
# on an unverified installer.
name: Package

on:
  workflow_dispatch:
    inputs:
      upload_installer:
        description: 'Upload the unsigned .exe / .dmg / Linux packages as run artifacts (public in a public repo)'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  windows-installer:
    name: Build + verify the Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Node version
        id: node
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CRAN's R installer + Windows binaries from the dated Posit snapshot in
      # shared/r-packages.json (no conda since 0.2.23).
      - name: Vendor the R runtime
        shell: pwsh
        # Directly in pwsh, not via pnpm's `powershell -File`: Windows
        # PowerShell 5.1 started from pwsh inherits pwsh's PSModulePath and
        # cannot load Microsoft.PowerShell.Utility (Get-FileHash not found).
        run: ./scripts/vendor-r-runtime-win.ps1

      - name: Build renderer + main
        run: pnpm build

      # Unsigned: electron-builder.json names the official certificate by
      # thumbprint, which only the release machine has. CI builds from a copy
      # without it (electron-builder then skips signing); the file stays as is.
      - name: Package with electron-builder
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('electron-builder.json','utf8')); delete c.win.signtoolOptions.certificateSha1; fs.mkdirSync('tmp',{recursive:true}); fs.writeFileSync('tmp/electron-builder.ci.json', JSON.stringify(c))"
          pnpm exec electron-builder --win --publish never --config tmp/electron-builder.ci.json

      # The point of this whole workflow. Boots the packaged binary too, so a
      # runtime that copied in but cannot actually start still fails here.
      - name: Verify the packaged build
        run: node scripts/verify-packaged-build.cjs --with-app

      - name: Report installer size
        shell: bash
        run: ls -lh dist/*.exe

      - name: Upload installer
        if: inputs.upload_installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sai-statistics-windows-installer
          path: app/dist/*.exe
          # Opt-in only: in a public repository artifacts are downloadable by
          # anyone, and an unsigned installer must not look like an official
          # build (official builds are signed and published elsewhere). Kept short because each installer is a few hundred MB against the
          # account's storage quota.
          retention-days: 14
          if-no-files-found: error

  # Same idea for macOS, once per CPU: the runtime is built the CRAN way and
  # each .dmg carries the R for its own architecture, so there is no universal
  # build. Unsigned (identity: null); official builds are signed and notarised
  # by the release process, not here. macOS minutes are free on a public repo.
  macos-dmg:
    name: Build + verify the macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            builder_arch: --arm64
          # GitHub's Intel macOS label; update it if GitHub retires it.
          - runner: macos-15-intel
            arch: x86_64
            builder_arch: --x64
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the CRAN installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/tmp/r-installers
          key: r-installer-${{ matrix.arch }}-${{ hashFiles('app/shared/r-packages.json') }}

      - name: Vendor the R runtime
        env:
          SAI_R_VERSION: "4.6.1"
          SAI_R_ARCH: ${{ matrix.arch }}
        run: pnpm vendor:r-runtime:mac

      - name: Build renderer + main
        run: pnpm build

      - name: Package with electron-builder
        run: |
          node scripts/gen-third-party-notices.cjs
          pnpm exec electron-builder --mac ${{ matrix.builder_arch }} --publish never

      - name: Verify the packaged build
        run: node scripts/verify-packaged-build.cjs --with-app

      - name: Report package size
        run: ls -lh dist/*.dmg dist/*.zip

      - name: Upload package
        if: inputs.upload_installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sai-statistics-macos-${{ matrix.arch }}
          path: app/dist/*.dmg
          retention-days: 14
          if-no-files-found: error

  # Linux: the .deb / .rpm / AppImage a user downloads, with the runtime
  # vendor-r-runtime.sh builds (conda-forge R 4.6.1 + the toolchain, packages
  # compiled from the Posit snapshot), the slowest of the three. ci.yml's e2e
  # job uses a system R, so only this job runs the shipped Linux runtime.
  # Flatpak is a separate build (flatpak-builder) and not covered here.
  linux-packages:
    name: Build + verify the Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        # Login shell, so the conda that setup-miniconda installs is on PATH.
        shell: bash -el {0}
        working-directory: app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 12.15.0
          auto-activate-base: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rpm: electron-builder's rpm target calls rpmbuild. xvfb + Electron's
      # system libraries: the packaged app is booted below, as in ci.yml's e2e.
      - name: Install packaging + display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb
          npx playwright install-deps chromium

      - name: Vendor the R runtime
        run: pnpm vendor:r-runtime

      - name: Build renderer + main
        run: pnpm build

      - name: Package with electron-builder
        run: |
          node scripts/gen-third-party-notices.cjs
          pnpm exec electron-builder --linux --publish never

      - name: Verify the packaged build
        run: xvfb-run -a node scripts/verify-packaged-build.cjs --with-app

      - name: Report package sizes
        run: ls -lh dist/*.AppImage dist/*.deb dist/*.rpm

      - name: Upload packages
        if: inputs.upload_installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sai-statistics-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.rpm
          retention-days: 14
          if-no-files-found: error
