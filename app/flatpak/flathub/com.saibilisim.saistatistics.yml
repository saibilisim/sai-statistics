app-id: com.saibilisim.saistatistics
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: sai-statistics
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # AI assistant (SAI account) requests.
  - --share=network
  # Data files are chosen through the file-chooser portal (GTK_USE_PORTAL in the
  # launcher); these cover the usual places a dataset lives without --filesystem=host.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --talk-name=org.freedesktop.Notifications
  # Electron's safeStorage keeps the user's SAI account session in the system keyring
  # (Secret Service, backend gnome_libsecret — direct D-Bus, no portal path).
  - --talk-name=org.freedesktop.secrets

modules:
  - name: sai-statistics
    buildsystem: simple
    build-commands:
      - mkdir -p /app/sai-statistics
      - cp -r linux-unpacked/. /app/sai-statistics/
      - install -Dm755 sai-statistics.sh /app/bin/sai-statistics
      - install -Dm644 com.saibilisim.saistatistics.desktop -t /app/share/applications
      - install -Dm644 com.saibilisim.saistatistics.metainfo.xml -t /app/share/metainfo
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.saibilisim.saistatistics.png
    sources:
      - type: dir
        path: ../dist/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: sai-statistics-bundle.sh
        dest-filename: sai-statistics.sh
      - type: file
        path: flathub/com.saibilisim.saistatistics.desktop
      - type: file
        path: flathub/com.saibilisim.saistatistics.metainfo.xml
      - type: file
        path: flathub/icon-512.png
