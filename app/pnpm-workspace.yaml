packages:
  - '.'
# Install the prebuilt DuckDB bindings for every OS/arch, not just the host's:
# electron-builder can cross-package (e.g. pnpm dist:win on Linux) and needs
# the target platform's .node binaries present in node_modules.
supportedArchitectures:
  os:
    - linux
    - darwin
    - win32
  cpu:
    - x64
    - arm64
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
onlyBuiltDependencies:
  - esbuild
  - electron
# Security fixes for transitive deps (mostly electron-builder's chain) whose
# parents' ranges already allow the patched version but the lockfile pinned
# an older one. Drop an entry once the parent ships with the fix.
# sprintf-js has an advisory with no published fix (latest is 1.1.3).
overrides:
  '@xmldom/xmldom@>=0.8.0 <0.8.15': ^0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': ^0.9.12
  baseline-browser-mapping@<2.11.0: ^2.11.0
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  browserslist@<4.28.7: ^4.28.7
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  http-cache-semantics@<4.2.1: ^4.2.1
  tar@<7.5.21: ^7.5.21
  undici@>=6.0.0 <6.28.1: ^6.28.1
